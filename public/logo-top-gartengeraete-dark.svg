<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="Top Gartengeräte">
  <defs>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="greenArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="55%" stop-color="#00a86b"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- Circular sun & lush grass emblem -->
  <g transform="translate(6, 5)">
    <path d="M8 38 A26 26 0 1 1 60 38" fill="none" stroke="url(#greenArc)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="34" cy="34" r="19" fill="url(#sunGlow)" opacity="0.28"/>
    <circle cx="34" cy="34" r="11" fill="url(#sunGlow)"/>
    <!-- Sun rays -->
    <g stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
      <line x1="34" y1="14" x2="34" y2="19"/>
      <line x1="21" y1="19" x2="24.5" y2="23"/>
      <line x1="47" y1="19" x2="43.5" y2="23"/>
      <line x1="15" y1="30" x2="20" y2="31"/>
      <line x1="53" y1="30" x2="48" y2="31"/>
    </g>
    <!-- Layered garden hills & grass blades -->
    <path d="M7 42 Q22 30 37 40 Q49 33 61 42 L61 46 Q34 50 7 46 Z" fill="#15803d"/>
    <path d="M12 43 Q24 34 34 42 Q44 35 56 43 Z" fill="#22c55e" opacity="0.9"/>
    <path d="M16 42 L13 33 L19 40 L22 29 L25 40 L29 31 L31 41 L36 30 L39 41 L44 32 L46 41 L51 34 L50 42 Z" fill="#166534"/>
  </g>
  <!-- Typography: TOP + GARTENGERÄTE -->
  <text x="80" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="4" fill="#166534">TOP</text>
  <text x="81" y="53" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.2" font-weight="700" letter-spacing="1.65" fill="#15803d">GARTENGERÄTE</text>
</svg>
